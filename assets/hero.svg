<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Ilustrasi halaman web yang accessible</title>
  <desc id="d">Jendela browser berisi judul, gambar dengan label alt, tombol dengan cincin fokus kuning, dan contoh kontras warna. Di bawahnya empat kotak huruf P, O, U, R.</desc>

  <rect x="20" y="30" width="520" height="380" rx="18" fill="#e3eff8"/>

  <!-- jendela -->
  <rect x="60" y="60" width="400" height="300" rx="10" fill="#ffffff" stroke="#14243b" stroke-width="3"/>
  <rect x="60" y="60" width="400" height="36" rx="10" fill="#14243b"/>
  <rect x="60" y="80" width="400" height="16" fill="#14243b"/>
  <rect x="80" y="70" width="190" height="16" rx="8" fill="#2b4262"/>

  <!-- judul dan teks -->
  <rect x="90" y="122" width="210" height="16" rx="3" fill="#14243b"/>
  <rect x="90" y="150" width="300" height="9" rx="3" fill="#b9cbdb"/>
  <rect x="90" y="167" width="250" height="9" rx="3" fill="#b9cbdb"/>

  <!-- gambar + label alt -->
  <rect x="90" y="196" width="150" height="112" rx="6" fill="#cfe3f2"/>
  <circle cx="204" cy="224" r="13" fill="#f5c518"/>
  <polygon points="90,308 138,244 172,282 196,258 240,308" fill="#1d5c94"/>
  <rect x="98" y="284" width="134" height="22" rx="11" fill="#14243b"/>
  <text x="165" y="299" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#ffffff">alt="pegunungan"</text>

  <!-- tombol dengan cincin fokus -->
  <rect x="272" y="192" width="160" height="62" rx="12" fill="none" stroke="#f5c518" stroke-width="4"/>
  <rect x="282" y="202" width="140" height="42" rx="7" fill="#1d5c94"/>
  <text x="352" y="229" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Simpan</text>

  <!-- kontras warna -->
  <rect x="282" y="272" width="60" height="56" rx="6" fill="#14243b"/>
  <text x="312" y="309" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Aa</text>
  <rect x="352" y="272" width="60" height="56" rx="6" fill="#f5c518"/>
  <text x="382" y="309" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#14243b">Aa</text>

  <!-- tombol Tab -->
  <rect x="428" y="316" width="70" height="44" rx="9" fill="#14243b"/>
  <rect x="428" y="316" width="70" height="38" rx="9" fill="#2b4262"/>
  <text x="463" y="341" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#f5c518">Tab</text>

  <!-- P O U R -->
  <g font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <rect x="60" y="370" width="34" height="34" rx="6" fill="#f5c518"/><text x="77" y="394" fill="#14243b">P</text>
    <rect x="102" y="370" width="34" height="34" rx="6" fill="#f5c518"/><text x="119" y="394" fill="#14243b">O</text>
    <rect x="144" y="370" width="34" height="34" rx="6" fill="#f5c518"/><text x="161" y="394" fill="#14243b">U</text>
    <rect x="186" y="370" width="34" height="34" rx="6" fill="#f5c518"/><text x="203" y="394" fill="#14243b">R</text>
  </g>
</svg>
